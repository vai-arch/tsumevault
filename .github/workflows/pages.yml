# Despliegue de TsumeVault en GitHub Pages.
# Sustituye a la compilacion automatica con Jekyll, que con ~119.000 ficheros
# superaba el tiempo de espera del despliegue. Aqui:
#   - se publica solo lo que usa la web (fuera scripts, docs, tests...);
#   - no se ejecuta Jekyll;
#   - dos jobs: "build" prepara y sube el sitio, "deploy" lo publica. Si falla
#     solo la publicacion, se puede relanzar el job "deploy" ("Re-run failed jobs")
#     sin volver a subir el sitio: con un unico job, el reintento subia un segundo
#     artefacto "github-pages" y deploy-pages fallaba con "Multiple artifacts".
#   - GitHub limita el despliegue de Pages a 10 minutos (timeout 600000 ms).
# Requiere: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar el sitio (solo lo publicable)
        run: |
          # Lo mismo que ya excluia Jekyll (nombres que empiezan por "_" o ".")
          # mas los ficheros de desarrollo. De server/ solo se publica
          # tsumeVault.db: la app la descarga como plan B cuando no hay BD local
          # ni servidor. tests/ y tools/ no se publican.
          rsync -a \
            --include='/server/' --include='/server/tsumeVault.db' --exclude='/server/*' \
            --exclude='/tests/' --exclude='/tools/' \
            --exclude='.*' \
            --exclude='_*' \
            --exclude='docs/' \
            --exclude='v2/' \
            --exclude='*.py' --exclude='*.pyc' \
            --exclude='*.bat' --exclude='*.sh' \
            --exclude='*.md' --exclude='*.txt' --exclude='*.sql' \
            ./ "$RUNNER_TEMP/site/"
          echo "Ficheros publicados: $(find "$RUNNER_TEMP/site" -type f | wc -l)"
          du -sh "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
